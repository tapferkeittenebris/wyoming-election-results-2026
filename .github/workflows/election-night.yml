name: Wyoming election-night updater

on:
  workflow_dispatch:
  push:
    paths:
      - 'github_updater.py'
      - 'github_updater_hardened.py'
      - 'sos_fallback.py'
      - 'sources.json'
      - 'candidates.csv'
      - 'freedom_caucus_candidates.csv'
      - 'statewide_candidates.csv'
      - 'incumbents.json'
      - '.github/workflows/election-night.yml'
  schedule:
    # 7:00 PM MDT Aug 18 = 01:00 UTC Aug 19; 2:00 AM MDT = 08:00 UTC.
    # Scheduled every 10 minutes; Python additionally enforces the exact 2026 window.
    - cron: '*/10 1-8 19 8 *'

permissions:
  contents: write

concurrency:
  group: election-night-results
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scraper dependencies
        run: pip install -r requirements.txt
      - name: Refresh county results and SOS validation layer
        run: python github_updater_hardened.py
      - name: Fill missing counties from Wyoming SOS precinct summaries
        run: python sos_fallback.py
      - name: Commit changed dashboard data
        run: |
          CHANGED="$(git status --porcelain -- state.json results.json incumbents.json)"
          if [ -z "$CHANGED" ]; then
            echo "No feed changes to commit."
            exit 0
          fi
          git config user.name "wyoming-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json results.json
          if [ -f incumbents.json ]; then git add incumbents.json; fi
          git commit -m "Refresh election dashboard data"
          git pull --rebase
          git push
