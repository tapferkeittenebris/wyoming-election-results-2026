name: Wyoming election-night updater

on:
  workflow_dispatch:
  push:
    paths:
      - 'github_updater.py'
      - 'github_updater_hardened.py'
      - 'sos_fallback.py'
      - 'winner_calls.py'
      - 'apply_winner_ui_patch.py'
      - 'sheridan_updater.py'
      - 'sheridan_candidates.csv'
      - 'sheridan.html'
      - 'sources.json'
      - 'candidates.csv'
      - 'freedom_caucus_candidates.csv'
      - 'statewide_candidates.csv'
      - 'incumbents.json'
      - '.github/workflows/election-night.yml'
  schedule:
    - cron: '*/10 1-8 19 8 *'

permissions:
  contents: write

concurrency:
  group: election-night-results
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scraper dependencies
        run: pip install -r requirements.txt
      - name: Refresh county results and SOS validation layer
        run: python github_updater_hardened.py
      - name: Fill missing counties from Wyoming SOS precinct summaries
        run: python sos_fallback.py
      - name: Apply conservative mathematical race calls
        run: python winner_calls.py
      - name: Ensure dashboard supports WINNER badges
        run: python apply_winner_ui_patch.py
      - name: Refresh Sheridan County ballot dashboard
        run: python sheridan_updater.py
      - name: Commit changed dashboard data
        run: |
          CHANGED="$(git status --porcelain -- state.json results.json sheridan-results.json incumbents.json index.html)"
          if [ -z "$CHANGED" ]; then
            echo "No feed changes to commit."
            exit 0
          fi
          git config user.name "wyoming-election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json results.json index.html
          if [ -f sheridan-results.json ]; then git add sheridan-results.json; fi
          if [ -f incumbents.json ]; then git add incumbents.json; fi
          git commit -m "Refresh election dashboard data"
          git pull --rebase
          git push
