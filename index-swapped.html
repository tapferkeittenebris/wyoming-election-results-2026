<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="dashboard" src="/index.html" title="Wyoming 2026 Primary Legislative Results"></iframe><script>document.getElementById('dashboard').addEventListener('load',function(){const d=this.contentDocument;if(!d)return;const s=d.createElement('style');s.textContent='.district.fc{fill:#111!important}.district.other{fill:url(#rainbow)!important}.swatch.fc{background:#111!important}.swatch.other{background:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#004dff,#750787)!important}.metrics{grid-template-columns:minmax(0,260px)!important}.metrics .metric:nth-child(n+2){display:none!important}';d.head.appendChild(s);d.querySelectorAll('.map-sub').forEach(x=>x.textContent='Black = FC · Rainbow = non-FC · Gray = awaiting 2026 result');const incumbents={2:{name:'Brian Boner',fc:false},4:{name:'Tara Nethercott',fc:false},8:{name:'Jared Olsen',fc:false},10:{name:'Gary Crum',fc:false},12:{name:'John Kolb',fc:true},14:{name:'Laura Pearson',fc:true},16:{name:'Dan Dockstader',fc:false},18:{name:'Tim French',fc:true},20:{name:'Ed Cooper',fc:false},22:{name:'Barry Crago',fc:false},24:{name:'Troy McKeown',fc:false},26:{name:'Tim Salazar',fc:false},28:{name:'Jim Anderson',fc:false},30:{name:'Charles Scott',fc:false}};function applySenateIncumbents(){const box=d.getElementById('senateMap');if(!box)return;const svg=box.querySelector('svg');if(!svg)return;const gs=[...svg.querySelectorAll(':scope > g')];for(const [num,info] of Object.entries(incumbents)){const g=gs[Number(num)-1];if(!g)continue;const rect=g.querySelector('rect');const title=g.querySelector('title');if(rect)rect.setAttribute('class','district '+(info.fc?'fc':'other'));if(title)title.textContent='Senate District '+num+': '+info.name+' (incumbent; not on 2026 ballot)'}const legend=box.querySelector('.map-legend');if(legend)legend.innerHTML='<span><i class="swatch fc"></i>FC</span><span><i class="swatch other"></i>Non-FC</span><span><i class="swatch waiting"></i>Awaiting 2026 result</span>'}const houseLegend=d.querySelector('#houseMap .map-legend');if(houseLegend)houseLegend.innerHTML='<span><i class="swatch fc"></i>FC</span><span><i class="swatch other"></i>Non-FC</span><span><i class="swatch waiting"></i>No leader yet</span>';applySenateIncumbents();const senate=d.getElementById('senateMap');if(senate)new MutationObserver(()=>setTimeout(applySenateIncumbents,0)).observe(senate,{childList:true});});</script></body></html>
