<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wyoming 2026 Primary Legislative Results</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="dashboard" src="/index.html" title="Wyoming 2026 Primary Legislative Results"></iframe><script>document.getElementById('dashboard').addEventListener('load',function(){const d=this.contentDocument;if(!d)return;const s=d.createElement('style');s.textContent='.district.fc{fill:#111!important}.district.other{fill:url(#rainbow)!important}.swatch.fc{background:#111!important}.swatch.other{background:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#004dff,#750787)!important}';d.head.appendChild(s);d.querySelectorAll('.map-sub').forEach(x=>x.textContent='Black = FC leader · Rainbow = non-FC leader');const legends=d.querySelectorAll('.map-legend');legends.forEach(x=>x.innerHTML='<span><i class="swatch fc"></i>FC</span><span><i class="swatch other"></i>Non-FC</span><span><i class="swatch waiting"></i>No leader yet</span>')});</script></body></html>
